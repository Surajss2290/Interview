name: CI-CD Pipeline

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t surajsuryawanshi2290/spring-boot-docker.jar:latest .

      - name: Push Docker Image
        run: docker push surajsuryawanshi2290/spring-boot-docker.jar:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull surajsuryawanshi2290/spring-boot-docker.jar:latest

            docker stop spring-boot-app || true
            docker rm spring-boot-app || true

            docker run -d \
              --name spring-boot-app \
              -p 8080:8080 \
              surajsuryawanshi2290/spring-boot-docker.jar:latest